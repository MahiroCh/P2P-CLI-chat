[package]
name = "p2p-chat"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "p2pchat"
path = "src/main.rs"

[lib] 
path = "src/lib/mod.rs"

[dependencies]
rustyline-async = "0.4.9"
clap = { version = "4.6.0", features = ["derive"] }
shlex = "1.3.0"
nix = { version = "0.31.2", features = ["signal", "process", "fs"] }
tokio = { version = "1.51.1", features = ["net", "io-util", "macros", "rt-multi-thread", "signal", "sync"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
iroh = "0.98.1"
thiserror = "2.0.18"
log = "0.4.29"
flexi_logger = { version = "0.31.8", default-features = false }
paste = "1.0.15"
chrono = { version = "0.4", features = ["clock"] }

[profile.release]
lto = true
